site_name: py-ltc-color-palettes
site_description: Python replica of loukesio/ltc-color-palettes.
site_url: https://marioernestovaldes.github.io/py-ltc-color-palettes/
repo_url: https://github.com/marioernestovaldes/py-ltc-color-palettes
repo_name: marioernestovaldes/py-ltc-color-palettes

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
  features:
    - navigation.sections
    - navigation.instant
    - content.code.copy

nav:
  - Home: index.md
  - Usage: usage.md
  - Palette Gallery: gallery.md
  - Examples: examples.md
  - Reference: reference.md
  - Palette Explorer: palette-explorer.html

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
