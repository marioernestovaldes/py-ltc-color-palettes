[metadata]
name = py-ltc-color-palettes
version = 0.1.0
description = Python replica of loukesio/ltc-color-palettes.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = py-ltc-color-palettes contributors
keywords = color, palette, matplotlib, visualization, ltc
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Scientific/Engineering :: Visualization
url = https://github.com/loukesio/ltc-color-palettes
project_urls =
    Homepage = https://github.com/loukesio/ltc-color-palettes
    Reference = https://github.com/loukesio/ltc-color-palettes

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    colorspace>=1.0.0
    matplotlib>=3.7
    numpy>=1.23
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
py_ltc_color_palettes = py.typed

[options.extras_require]
dev =
    build>=1.2
    mkdocs>=1.6
    mkdocs-material>=9.5
    pytest>=8
